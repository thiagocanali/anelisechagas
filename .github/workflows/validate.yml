name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend contract tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  security-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-remediation-preview:
    name: Generate safe dependency remediation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Export lockfile remediation
        run: |
          mkdir -p remediation
          cp package-lock.json remediation/package-lock.json
          git diff -- package-lock.json > remediation/lockfile.patch
          npm audit --omit=dev --audit-level=high > remediation/audit-report.txt 2>&1 || true

      - name: Upload remediation for review
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-preview
          path: remediation/
          retention-days: 7
